name: STUPUL CI

on:
  push:
    branches: [ main, master, genesis-v3.4, genesis-v3.5 ]
  pull_request:
    branches: [ main, master, genesis-v3.4, genesis-v3.5 ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Royalty & Security Invariants
        run: node scripts/royalty_guard.cjs

      - name: Build Monorepo (TypeScript & Vite)
        run: npm run build

      - name: Run Test Suite (Vitest)
        run: npm test
